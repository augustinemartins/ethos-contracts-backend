# deny.toml — cargo-deny configuration (#102)
# https://embarkstudios.github.io/cargo-deny/

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
# Minimum vulnerability CVSS score to trigger a build failure (0.0–10.0).
# "high" maps to CVSS >= 7.0.
vulnerability = "deny"
# Warn on (but do not block) unmaintained and unsound crates.
unmaintained = "warn"
unsound = "warn"
yanked = "warn"
notice = "warn"

# Ignored advisories — reviewed and accepted due to transitive SDK constraints.
# Keep in sync with .cargo/audit.toml.
ignore = [
    # `paste` (unmaintained) is pulled in transitively by soroban-wasmi.
    "RUSTSEC-2024-0436",
    # `rand` 0.8.5 (unsound only with a custom logger calling rand::rng())
    # pinned transitively by soroban-env-host / soroban-sdk.
    "RUSTSEC-2026-0097",
]

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Block multiple versions of the same crate by default — helps catch
# dependency confusion and reduces WASM binary bloat.
multiple-versions = "warn"

# Crates that must never appear in the dependency tree.
deny = [
    # Known-vulnerable / unmaintained crypto crates.
    { crate = "rust-crypto" },
    { crate = "openssl" },            # use rustls instead
    { crate = "md-5" },               # MD5 is cryptographically broken
]

# Crates allowed to appear more than once (transitive SDK version conflicts).
skip = [
    # Soroban SDK pins older versions of several common crates.
    { crate = "syn" },
    { crate = "quote" },
    { crate = "proc-macro2" },
    { crate = "regex" },
    { crate = "regex-syntax" },
    { crate = "bitflags" },
    { crate = "rand" },
    { crate = "rand_core" },
    { crate = "rand_chacha" },
    { crate = "getrandom" },
    { crate = "serde" },
    { crate = "serde_derive" },
    { crate = "indexmap" },
    { crate = "hashbrown" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
# Allow the OSI-approved copyleft-free licenses common in the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "Zlib",
]

# Copyleft licenses that would infect the binary — block them.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-1.0",
    "AGPL-3.0",
    "EUPL-1.1",
    "EUPL-1.2",
]

# Threshold of confidence for license detection in crates without SPDX
# identifiers (0.0–1.0).  0.8 is a good default.
confidence-threshold = 0.8

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Allow crates from crates.io and our own git dependencies.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
